version: '3.8'
services:
  # Local Redis service
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - app-network

  app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - PORT=8080
      - DEBUG=true  # Enable debug mode for local development
    depends_on:
      - redis
    networks:
      - app-network
    # For development only: enable hot reloading by mounting source code
    # Comment these out when testing the production build
    # volumes:
    #   - ./src:/app/src
    #   - ./dist:/app/dist

volumes:
  redis-data:

networks:
  app-network:
    driver: bridge 