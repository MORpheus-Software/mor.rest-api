version: '3'

services:
  redis:
    image: redis:alpine
    container_name: morsaas-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: morsaas-app
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - PORT=8080
      - REDIS_URL=redis://redis:6379
      - VITE_API_BASE_URL=https://nfa-proxy-1081887913409.us-west1.run.app
      - USE_LOCAL_REDIS=true
    volumes:
      - ./logs:/app/logs

volumes:
  redis-data:

networks:
  app-network:
    driver: bridge 