name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: morsaas
  REGION: us-west1
  SCRIPT_PATH: ./scripts/deploy-to-cloud-run.sh

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Make deploy script executable
      run: chmod +x ${{ env.SCRIPT_PATH }}
      
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v1
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'
        
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        install_components: 'gke-gcloud-auth-plugin'
        
    - name: Authorize Docker push
      run: gcloud auth configure-docker
      
    - name: Build and push Docker image
      run: |
        docker build -t gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }} .
        docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }}
        
    - name: Deploy to Cloud Run
      id: deploy
      run: |
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
          --platform managed \
          --region ${{ env.REGION }} \
          --memory 2Gi \
          --cpu 1 \
          --concurrency 80 \
          --min-instances 0 \
          --max-instances 10 \
          --timeout 600s \
          --startup-cpu-boost \
          --execution-environment gen2 \
          --no-cpu-throttling \
          --set-env-vars "NODE_ENV=production,REDIS_URL=${{ secrets.REDIS_URL }}" \
          --allow-unauthenticated
          
        SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.url)')
        echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT
        
    - name: Show Output
      run: echo ${{ steps.deploy.outputs.url }}
      
    - name: Send deployment notification
      if: success()
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_CHANNEL: deployments
        SLACK_COLOR: good
        SLACK_ICON: https://github.com/google-github-actions.png?size=48
        SLACK_MESSAGE: "MorSaaS deployed to Cloud Run! :rocket: \n${{ steps.deploy.outputs.url }}"
        SLACK_TITLE: "Deployment Successful - Using Upstash Redis for persistence"
        SLACK_USERNAME: GitHub Actions 