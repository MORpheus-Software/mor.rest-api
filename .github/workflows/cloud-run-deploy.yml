name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: morsaas
  REGION: us-west1
  SCRIPT_PATH: ./scripts/deploy-to-cloud-run.sh

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Make deploy script executable
      run: chmod +x ${{ env.SCRIPT_PATH }}
      
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v1
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'
        
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        install_components: 'gke-gcloud-auth-plugin'
        
    - name: Authorize Docker push
      run: gcloud auth configure-docker
      
    - name: Build and push Docker image
      run: |
        docker build -t gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }} .
        docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }}
        
    - name: Create Cloud Run YAML configuration
      run: |
        # Create a copy of the template YAML file
        cp ./scripts/cloud-run-config-template.yaml cloud-run-deploy-config.yaml
        
        # Replace placeholder values
        sed -i "s|PROJECT_ID|$PROJECT_ID|g" cloud-run-deploy-config.yaml
        sed -i "s|COMMIT_SHA|${{ github.sha }}|g" cloud-run-deploy-config.yaml
        sed -i "s|YOUR_REDIS_URL|${{ secrets.REDIS_URL }}|g" cloud-run-deploy-config.yaml
        sed -i "s|\${{ github.sha }}|${{ github.sha }}|g" cloud-run-deploy-config.yaml
        
        # Display the configuration (without sensitive data)
        echo "Deploying with the following configuration:"
        grep -v "REDIS_URL" cloud-run-deploy-config.yaml
        
    - name: Deploy to Cloud Run using YAML
      id: deploy
      run: |
        # Deploy using the YAML configuration for extended startup timeout
        echo "Starting deployment with extended startup timeout (240s)..."
        
        if gcloud run services replace cloud-run-deploy-config.yaml --region=${{ env.REGION }}; then
          echo "✅ Deployment successful!"
          
          # Get the deployed service URL
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT
          
          echo "Deployed with extended startup probe timeout (240 seconds)"
        else
          echo "❌ Deployment failed!"
          
          # Get the logs from the failed revision for debugging
          echo "Fetching logs from the failed revision..."
          LATEST_REVISION=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format='value(status.latestCreatedRevisionName)')
          
          echo "Latest revision: $LATEST_REVISION"
          gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=${{ env.SERVICE_NAME }} AND resource.labels.revision_name=$LATEST_REVISION" --limit=50
          
          exit 1
        fi
        
    - name: Show Output
      run: echo ${{ steps.deploy.outputs.url }}
      
    - name: Send deployment notification
      if: success()
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_CHANNEL: deployments
        SLACK_COLOR: good
        SLACK_ICON: https://github.com/google-github-actions.png?size=48
        SLACK_MESSAGE: "MorSaaS deployed to Cloud Run! :rocket: \n${{ steps.deploy.outputs.url }}"
        SLACK_TITLE: "Deployment Successful - Using Upstash Redis for persistence"
        SLACK_USERNAME: GitHub Actions 